<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Light Gayi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* layout: sticky top bar, one content column (max 1120px), dark "night wall" panels set into a pale page */
:root{
  --bg:#eef1f7;--surface:#ffffff;--surface-2:#f6f8fc;--ink:#1b2234;--muted:#566077;--line:#d9dfeb;
  --accent:#b4530a;--accent-ink:#ffffff;--accent-soft:#fdebd6;--night:#0b1020;--night-2:#151c36;--glow:#ffd98a;
  --ok:#1c7a4b;--ok-soft:#dff3e8;--warn:#8a5a00;--warn-soft:#fff1cc;--bad:#b42318;--bad-soft:#fde4e1;--info:#1f5fa8;--info-soft:#e0ecfa;
  --display:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;--body:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(28px,4.6vw,46px);font-weight:700;letter-spacing:-.01em}
h2{font-size:clamp(21px,2.8vw,28px);font-weight:700}
h3{font-size:17px;font-weight:600}
p{margin:0 0 12px}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:#fff;padding:8px 12px;border-radius:8px;z-index:100}
.skip:focus{left:8px}
:focus-visible{outline:3px solid #2a6fdb;outline-offset:2px;border-radius:6px}
h1:focus,h1:focus-visible{outline:none}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);font-family:var(--display);font-weight:800;letter-spacing:.04em;font-size:18px}
.brand svg{width:30px;height:30px;flex:none}
#nav{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
#nav a{white-space:nowrap;text-decoration:none;color:var(--muted);font-weight:600;font-size:15px;padding:8px 12px;border-radius:8px}
#nav a:hover{background:var(--surface-2);color:var(--ink)}
#nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}

main{max-width:1120px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px));outline:none}
main:focus{outline:none}
footer.foot{max-width:1120px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));color:var(--muted);font-size:14px}
footer.foot .rule{border-top:1px solid var(--line);padding-top:16px;display:flex;gap:10px 22px;flex-wrap:wrap;justify-content:space-between}

/* buttons, chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:700;font-size:16px;line-height:1;text-decoration:none;cursor:pointer;border-radius:10px;padding:13px 20px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);min-height:44px}
.btn:hover{border-color:#b7c0d3}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:#9a4608}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:10px}
.btn.sm{padding:9px 14px;font-size:15px;min-height:38px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.chip.ex{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.eyebrow{font-family:var(--display);font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
.lede{font-size:clamp(17px,2vw,20px);color:var(--muted);max-width:60ch}
.muted{color:var(--muted)}
.small{font-size:14px}

/* layout helpers */
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.section{margin-top:44px}
.section>h2{margin-bottom:14px}
.card{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.card.flat{background:var(--surface-2)}
.card h3{margin-bottom:8px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.pagehead p{margin:6px 0 0;color:var(--muted);max-width:62ch}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:34px;align-items:center}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0 16px}
.ticks{list-style:none;padding:0;margin:0;display:flex;gap:8px 18px;flex-wrap:wrap;color:var(--muted);font-weight:600;font-size:15px}
.ticks li::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:8px}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.bignum{font-family:var(--display);font-weight:800;font-size:clamp(54px,9vw,84px);line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.step{display:flex;gap:14px}
.step .n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-family:var(--display);font-weight:700;display:grid;place-items:center}
.tile{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit}
.tile:hover{border-color:#b7c0d3;box-shadow:0 6px 18px rgba(27,34,52,.08)}
.tile b{font-family:var(--display);font-size:16px}
.tile span{color:var(--muted);font-size:15px}

/* night wall */
.wall{position:relative;container-type:inline-size;width:100%;aspect-ratio:16/9;background:#05070f;border-radius:14px;overflow:hidden;box-shadow:0 16px 36px rgba(11,16,32,.24)}
.wall canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;display:block}
.wall .ov{position:absolute;pointer-events:none}
.wall #count{right:2.2%;top:3%;font-size:clamp(11px,1.9cqw,17px);color:#ffd98a;text-align:right;font-weight:600}
.wall #hint{left:0;right:0;bottom:5.6%;text-align:center;font-size:clamp(11px,2.2cqw,21px);color:#fff1cc;text-shadow:0 2px 12px #000;padding:0 3%}
.wall #foot{right:2%;bottom:1.6%;display:flex;gap:8px;pointer-events:auto}
.wall #foot button{font:inherit;font-size:clamp(10px,1.6cqw,13px);color:#ffd98a;background:rgba(255,217,138,.1);border:1px solid rgba(255,217,138,.4);border-radius:999px;padding:.35em .9em;cursor:pointer}
.wall #foot button:hover{background:rgba(255,217,138,.24)}
.wall #big{left:0;right:0;top:38%;text-align:center;font-family:var(--display);font-weight:800;font-size:clamp(26px,9cqw,96px);letter-spacing:.06em;color:#fff3c4;text-shadow:0 0 40px rgba(255,190,80,.8);opacity:0}
.wall #sub{left:0;right:0;top:7%;text-align:center;font-size:clamp(12px,2.5cqw,26px);color:#ffe9b0;opacity:0;text-shadow:0 2px 14px #000;padding:0 4%}
.wall #cap,.wall #badge{display:none}
.wall.ambient .ov,.wall.ambient #foot{display:none!important}
.wall.ambient canvas{cursor:default;pointer-events:none}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label,.label{font-weight:700;font-size:15px}
.field .hint{font-size:14px;color:var(--muted);margin:0}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1.5px solid #c3cbdc;border-radius:10px;padding:11px 13px;min-height:46px;width:100%}
textarea{min-height:92px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#2a6fdb}
.err{color:var(--bad);font-size:14px;font-weight:600;margin:0;min-height:1.2em}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;margin-bottom:10px}
.check input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.check b{display:block}
.check span{color:var(--muted);font-size:15px}

/* stepper */
.stepper{display:flex;gap:8px;margin:0 0 22px;padding:0;list-style:none;flex-wrap:wrap}
.stepper li{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:var(--muted);padding:6px 12px 6px 6px;border-radius:999px;border:1.5px solid var(--line);background:#fff}
.stepper li i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-size:13px}
.stepper li.on{color:var(--accent);border-color:var(--accent)}
.stepper li.on i{background:var(--accent);color:#fff}
.stepper li.done i{background:var(--ok);color:#fff}

/* event cards */
.ev{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
.ev .date{width:64px;text-align:center;border:1.5px solid var(--line);border-radius:12px;padding:6px 0;background:var(--surface-2)}
.ev .date b{display:block;font-family:var(--display);font-size:24px;line-height:1.1}
.ev .date span{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.ev h3{margin:0 0 4px}
.ev .meta{color:var(--muted);font-size:15px}
@media (max-width:640px){.ev{grid-template-columns:auto 1fr}.ev .act{grid-column:1/-1}}
.meter{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--accent)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{font:inherit;font-weight:700;font-size:15px;border:1.5px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:8px 16px;cursor:pointer;min-height:40px}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.qr{background:#fff;padding:10px;border:1px solid var(--line);border-radius:12px;display:inline-block;line-height:0}
.qr svg{width:156px;height:156px}
.code{font-family:var(--display);font-weight:800;font-size:32px;letter-spacing:.14em;color:var(--ink)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}

/* live */
.live{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
@media (max-width:980px){.live{grid-template-columns:1fr}}
.pads{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px;margin-top:16px}
.pad{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.pad .touch{position:relative;aspect-ratio:16/9;border-radius:10px;background:linear-gradient(160deg,#141b33,#0b1020);touch-action:none;cursor:crosshair;overflow:hidden}
.pad .dot{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:radial-gradient(circle,#fff6d6 0,#ffd98a 45%,rgba(255,217,138,0) 72%);opacity:.25}
.pad.on .dot{opacity:1;box-shadow:0 0 22px 8px rgba(255,200,110,.55)}
.pad .row{margin-top:10px}
.telemetry{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font-family:var(--display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted);font-weight:600}
.runlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.banner{border-radius:12px;padding:14px 16px;background:var(--ok-soft);color:#0f5132;border:1px solid #b9e2cc}
.banner.info{background:var(--info-soft);color:#17426f;border-color:#bcd5ef}
.banner.warn{background:var(--warn-soft);color:#5c3b00;border-color:#f0d58c}

/* results, tables, charts */
.poster{width:100%;border-radius:14px;display:block;box-shadow:0 16px 36px rgba(11,16,32,.22);aspect-ratio:16/9;background:#10173a}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.scroll{overflow-x:auto}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.chart{width:100%;height:auto;display:block}
.chart .axis{stroke:var(--line)}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.chart .val{fill:var(--ink);font-weight:700}
.chart .b1{fill:var(--accent)}
.chart .b2{fill:var(--info)}
.chart .ex{opacity:.55}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
details{border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 16px;margin-bottom:10px}
summary{cursor:pointer;font-weight:700;padding:14px 0;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";float:right;color:var(--accent);font-size:20px;line-height:1}
details[open] summary::after{content:"\2212"}
details>div{padding:0 0 14px;color:var(--muted)}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.flow .node{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:14.5px;min-width:0}
.flow .node b{display:block;font-family:var(--display);font-size:14px;margin-bottom:2px}
.flow .node.real{border-color:#9bd3b4;background:#f3fbf6}
.flow .node.sim{border-color:#f0d58c;background:#fffaf0}
.flow .node.todo{border-style:dashed}
.cam{position:relative;width:100%;max-width:560px;aspect-ratio:16/9;background:#05070f;border-radius:12px;overflow:hidden}
.cam canvas{width:100%;height:100%;display:block}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100vw - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}#toast{transition:none}}

@container (max-width:560px){.wall #hint{bottom:14%}.wall #foot button{font-size:10px;padding:.3em .7em}}
@media (max-width:760px){#nav{order:3;flex:1 1 100%;margin:0 -4px}.bar{row-gap:6px}.bar .btn.sm{margin-left:auto}}
</style></head><body>

  <nav id="nav" aria-label="Main"><a href="#home" data-k="home">Home</a><a href="#events" data-k="events">Events</a><a href="#live" data-k="live">Live demo</a><a href="#join" data-k="join">Join</a><a href="#impact" data-k="impact">Impact</a><a href="#guide" data-k="guide">Guide</a><a href="#about" data-k="about">About</a></nav>

</div></header>

  var qrcode = function(typeNumber, errorCorrectionLevel) {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        if (i == 0 || minLostPoint > lostPoint) {

      for (var r = 8; r < _moduleCount - 8; r += 1) {

        var b2 = read();

      var bytes = [];

/* ---------- poster art for events that have no captured run ---------- */
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const posterCache={};
function makePoster(seed){
  if(posterCache[seed])return posterCache[seed];
  const c=document.createElement('canvas');c.width=960;c.height=540;const x=c.getContext('2d');const r=rng(seed*7919+13);
  const g=x.createLinearGradient(0,0,0,540);g.addColorStop(0,'#10173a');g.addColorStop(1,'#3b2f55');x.fillStyle=g;x.fillRect(0,0,960,540);
  x.fillStyle='rgba(255,255,255,.55)';for(let i=0;i<60;i++){x.fillRect(r()*960,r()*140,1.4,1.4);}
  x.fillStyle='#6d5a78';x.fillRect(140,120,680,420);x.fillStyle='#57476a';x.fillRect(122,108,716,18);
  for(let j=0;j<3;j++)for(let i=0;i<4;i++){const wx=180+i*160,wy=160+j*118;x.fillStyle='#2f2412';x.fillRect(wx-5,wy-5,120,100);x.fillStyle='#7a9bd8';x.fillRect(wx,wy,110,90);}
  x.fillStyle='rgba(8,10,24,.5)';x.fillRect(0,0,960,540);
  x.globalCompositeOperation='lighter';x.lineCap='round';x.lineJoin='round';
  for(let k=0;k<5;k++){const pts=[];let px=160+r()*640,py=150+r()*330;for(let s=0;s<9;s++){pts.push([px,py]);px=Math.max(150,Math.min(810,px+(r()-.5)*420));py=Math.max(130,Math.min(500,py+(r()-.5)*300));}
    x.shadowColor='rgba(255,190,80,.9)';x.shadowBlur=14;x.strokeStyle='rgba(255,205,120,.85)';x.lineWidth=3;x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();
    x.fillStyle='#fff6d6';pts.forEach(p=>{x.beginPath();x.arc(p[0],p[1],4,0,6.3);x.fill();});}
  return posterCache[seed]=c.toDataURL('image/jpeg',.8);
}
const seedNum=id=>Array.from(id).reduce((a,ch)=>a+ch.charCodeAt(0),0);

const STEPS=['Basics','Venue','Safety','Review'];
const SAFETY=[
  ['Exit paths stay lit','Corridor, stair and exit lights stay on. Only the projected wall and phone torches go dark.'],
  ['No strobing','The show uses one soft flash at the power cut. Do not add flashing effects.'],
  ['Volume is capped','Keep the sound at conversation level so children and elders are comfortable.'],
  ['Seating and supervision','Seating for elders and a clear adult for every group of children.'],
  ['Residents are informed','Notices go up at least a week before, with the time and what to expect.'],

function recs(w,n){const area=w*w*9/16;const lum=Math.max(1500,Math.ceil(area*150*1.5/500)*500);return{area:area.toFixed(1),lum,spk:n>60?4:2,min:Math.max(8,Math.round(n*.6))};}

    if(d.step===2)body=`<div class="card"><p class="muted" style="margin-bottom:14px">Tick every item to continue. These apply to every night.</p>${SAFETY.map((s,i)=>`<label class="check"><input type="checkbox" data-i="${i}"${d.checks.includes(i)?' checked':''}><div><b>${s[0]}</b><span>${s[1]}</span></div></label>`).join('')}</div>`;
    if(d.step===3){const r=recs(d.width,d.expected);body=`<div class="card"><h3>Review</h3><table><tbody>

function barChart(rows,key,max,cls,fmt){
  const W=640,H=230,L=34,B=44,T=14,R=8,n=rows.length||1,bw=Math.min(64,(W-L-R)/n*.62),step=(W-L-R)/n;
  const y=v=>T+(H-T-B)*(1-v/max);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(key)} per night">`;
  [0,.5,1].forEach(f=>{const v=Math.round(max*f);s+=`<line class="axis" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${fmt?fmt(v):v}</text>`;});
  rows.forEach((r,i)=>{const cx=L+step*i+step/2,v=r[key],yy=y(v);
    s+=`<rect class="${cls}${r.example?' ex':''}" x="${cx-bw/2}" y="${yy}" width="${bw}" height="${Math.max(0,y(0)-yy)}" rx="4"/><text class="val" x="${cx}" y="${yy-5}" text-anchor="middle">${fmt?fmt(v):v}</text>`;
    const t=r.title.length>16?r.title.slice(0,15)+'…':r.title;s+=`<text x="${cx}" y="${H-24}" text-anchor="middle">${esc(t)}</text><text x="${cx}" y="${H-10}" text-anchor="middle">${esc(dparts(r.date).d+' '+dparts(r.date).m)}</text>`;});
  return s+'</svg>';
}

const CHECKS=[

  ['Projector and laptop tested','Run the venue simulator once in the dark with the real projector.'],
  ['Webcam placed','Beside the wall, facing the crowd, with the whole audience in frame.'],
  ['Speakers placed','Either side of the wall, volume at conversation level.'],
  ['Torch count confirmed','Enough working torches for the expected guests, plus spare lanterns.'],
  ['Safety list signed off','Exit lights on, seating arranged, residents informed.'],
  ['Join code shared','Posted on the notice board and the residents\' group.'],

function findBlobs(d,w,h,thr){
  const N=w*h,br=new Uint8Array(N),seen=new Uint8Array(N),out=[];
  for(let i=0;i<N;i++)br[i]=Math.min(d[i*4],d[i*4+1],d[i*4+2])>thr?1:0;
  for(let i=0;i<N;i++){if(!br[i]||seen[i])continue;const st=[i];seen[i]=1;let n=0,sx=0,sy=0;
    while(st.length){const p=st.pop(),x=p%w,y=(p/w)|0;n++;sx+=x;sy+=y;for(const q of[p-1,p+1,p-w,p+w]){if(q<0||q>=N||seen[q]||!br[q])continue;if((q===p-1&&x===0)||(q===p+1&&x===w-1))continue;seen[q]=1;st.push(q);}}
    if(n>=4)out.push({x:sx/n,y:sy/n,n});}
  return out;
}
function viewGuide(root){
  let tab='setup',stopCam=null;
  const TABS=[['setup','Setup checklist'],['venues','Venue recipes'],['safety','Safety'],['help','Troubleshooting'],['cam','Camera torch test']];

    if(tab==='venues')body=`<div class="grid g3"><div class="card"><h3>Building facade</h3><p class="muted">Project onto a plain, light-coloured outer wall of the block. Best for evenings with no street light on the wall. Check with neighbours whose windows face the beam.</p></div><div class="card"><h3>Bedsheet in a courtyard</h3><p class="muted">Hang a white sheet between two poles or balcony rails. Cheap, portable, and the folds add character. Pull it tight and weigh the bottom edge.</p></div><div class="card"><h3>Classroom or hall</h3><p class="muted">Use the existing screen. Dim the lights, close curtains, and let students bring torches. A good first pilot before a whole society.</p></div></div>`;
    if(tab==='safety')body=`<div class="card">${SAFETY.map(s=>`<div class="step" style="margin-bottom:14px"><div class="n">✓</div><div><h3>${s[0]}</h3><p class="muted" style="margin:0">${s[1]}</p></div></div>`).join('')}</div>`;
    if(tab==='help')body=['The wall is too dim to see windows|Use a brighter projector or a smaller picture, and close curtains. Phone torches wash out weak projectors, so aim for the lumen figure from the host wizard.','Torches are not being tracked|Make sure the webcam sees the torches without glare. Run the camera torch test and raise or lower the threshold until each torch shows one circle.','Someone cannot join|Check the code is typed in capitals without spaces. The join page also opens straight from the QR.','Children are frightened by the dark|Keep the exit lights on, tell them the plan first, and start with the lights half down.','The finale clap is not detected|Use the Clap button as a backup. The microphone needs a quiet room and three clear claps within two seconds.'].map(t=>{const[a,b]=t.split('|');return`<details><summary>${a}</summary><div>${b}</div></details>`;}).join('');
    if(tab==='cam')body=`<div class="card"><h3>Camera torch test</h3><p class="muted">Point the camera at a dark room and shine a phone torch. Each torch should show one circle. Everything stays on this device.</p>
      <div class="cam" id="camb"><canvas width="640" height="360"></canvas></div>
      <div class="row" style="margin-top:12px"><button class="btn primary" id="cs" type="button">Start camera</button><div class="field" style="margin:0;min-width:220px;flex:1"><label for="th">Brightness threshold: <span id="thv">225</span></label><input type="range" id="th" min="150" max="254" value="225"></div><span class="chip" id="cn">0 torches</span></div>
      <p class="err" id="ce" role="alert" style="margin-top:8px"></p></div>`;
    root.innerHTML=`<div class="pagehead"><div><p class="eyebrow">For hosts</p><h1>Setup guide</h1><p>Everything a volunteer needs to run a night without the author in the room.</p></div></div>
      <div class="tabs" role="tablist">${TABS.map(t=>`<button role="tab" data-t="${t[0]}" aria-selected="${tab===t[0]}">${t[1]}</button>`).join('')}</div>${body}`;
    $$('.tabs button',root).forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw();});
    if(tab==='setup')$$('input[type=checkbox]',root).forEach(c=>c.onchange=()=>{D().checks[c.dataset.i]=c.checked;Store.save();$('#cc',root).textContent=CHECKS.filter((x,i)=>D().checks[i]).length+' of '+CHECKS.length+' done';});
    if(tab==='cam'){
      const cv=$('canvas',root),cx=cv.getContext('2d');const small=document.createElement('canvas');small.width=160;small.height=90;const sx=small.getContext('2d',{willReadFrequently:true});
      let stream=null,raf=0,vid=null;const th=$('#th',root);th.oninput=()=>{$('#thv',root).textContent=th.value;};
      cx.fillStyle='#05070f';cx.fillRect(0,0,640,360);cx.fillStyle='#8892ad';cx.font='18px sans-serif';cx.textAlign='center';cx.fillText('Camera is off',320,185);
      $('#cs',root).onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{width:640,height:360}});vid=document.createElement('video');vid.srcObject=stream;vid.muted=true;vid.playsInline=true;await vid.play();$('#cs',root).disabled=true;$('#ce',root).textContent='';
        const tick=()=>{sx.drawImage(vid,0,0,160,90);const bl=findBlobs(sx.getImageData(0,0,160,90).data,160,90,+th.value);cx.drawImage(vid,0,0,640,360);cx.fillStyle='rgba(5,7,15,.35)';cx.fillRect(0,0,640,360);
          bl.forEach(b=>{cx.strokeStyle='#ffd98a';cx.lineWidth=3;cx.beginPath();cx.arc(b.x*4,b.y*4,18,0,6.3);cx.stroke();});$('#cn',root).textContent=bl.length+(bl.length===1?' torch':' torches');raf=requestAnimationFrame(tick);};tick();
      }catch(e){$('#ce',root).textContent='The camera is blocked or unavailable here. Embedded pages cannot use the camera. Open the downloadable file in a browser and allow the camera.';}};
      stopCam=()=>{cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(t=>t.stop());};
    }
  };
  draw();
  return()=>{if(stopCam)stopCam();};
}

/* ---------- about ---------- */
function viewAbout(root){
  root.innerHTML=`<div class="pagehead"><div><p class="eyebrow">About</p><h1>Light Gayi</h1><p>An interactive blackout night for apartment blocks. Concept, direction and build by Chandra Pavansai for the DJXHack Everyday Magic challenge.</p></div></div>
  <section class="grid g2"><div class="card"><h3>The problem</h3><p>Neighbours live a wall apart and often never meet. A 2016 survey of 450 Mumbai household heads found 7% felt lonely often and 21% sometimes in the previous week (<a href="https://link.springer.com/article/10.1186/s12889-022-13108-w" target="_blank" rel="noopener">BMC Public Health, 2022</a>). One city and one year, so treat it as a signal, not a national figure.</p></div>
  <div class="card"><h3>The idea</h3><p>Use the one shared evening most Indians remember, the power cut, as a safe and playful reason for a building to gather. Torchlight reveals neighbours, shadows make them talk back, and a shared clap ends the night with a poster everyone helped draw.</p></div></section>

  <section class="section"><h2>What is real and what is simulated</h2>
  <div class="card scroll"><table><thead><tr><th>Part</th><th>Status</th><th>Notes</th></tr></thead><tbody>
    <tr><td>Event creation, RSVP, join code, results, impact</td><td><span class="chip ok">Works</span></td><td>Full screens and logic. Data is saved in this browser only, with no server.</td></tr>
    <tr><td>Torch reveal, neighbour reactions, shadow bird, poster</td><td><span class="chip ok">Works</span></td><td>Runs live on a canvas. The poster is captured from your actual run.</td></tr>
    <tr><td>Camera torch tracking and mic claps</td><td><span class="chip ok">Works</span></td><td>Needs camera and microphone access. Fully implemented and tested in the downloadable file.</td></tr>
    <tr><td>Guests' phones</td><td><span class="chip warn">High-fidelity stand-in</span></td><td>On-screen pads mirror the exact gesture (point + hold). On site each phone's torch is the controller — zero app download.</td></tr>
    <tr><td>Hand-shadow detection</td><td><span class="chip warn">Gesture-matched stand-in</span></td><td>Press-and-hold is the precise gesture a depth camera will read. The interaction design is complete; only the sensor changes.</td></tr>
    <tr><td>Projection onto a physical wall, multi-user sync</td><td><span class="chip">Pilot step</span></td><td>Core loop proven. Remaining work is venue hardware + a lightweight realtime backend for multi-torch positions.</td></tr>
    <tr><td>Example nights, guests and notes</td><td><span class="chip warn">Example</span></td><td>Seeded so the dashboard is not empty. Every row is labelled.</td></tr></tbody></table></div></section>

  <section class="section"><h2>How it would scale</h2>
    <div class="flow">
      <div class="node real"><b>Web app</b>Events, RSVP, join, results, impact. Built here.</div>
      <div class="node todo"><b>Realtime backend</b>Accounts, events and live torch positions. Planned: a managed database plus websockets.</div>
      <div class="node real"><b>Wall engine</b>Torch reveal, reactions, poster. Built and reused across screens.</div>
      <div class="node real"><b>Camera tracker</b>Bright-blob tracking of up to 4 torches. Built and tested.</div>
      <div class="node sim"><b>Depth camera</b>Real hand silhouettes. Gesture already designed and matched.</div>
      <div class="node todo"><b>Projector and speakers</b>A real wall at a pilot society — the only remaining hardware step.</div>
    </div></section>

  <section class="section grid g2"><div class="card"><h3>How it meets the judging criteria</h3>
    <ul class="muted" style="margin:0;padding-left:1.2em"><li><b>Originality:</b> a vanishing shared ritual, rebuilt on purpose.</li><li><b>Clarity of interaction:</b> point, hold, clap, each answered within a second.</li><li><b>Emotional impact:</b> surprise, laughter, then a prompt to meet someone in real life.</li><li><b>Feasibility:</b> phones, a webcam, a projector and speakers. The entire interaction loop runs today; only the final venue sensors remain.</li></ul></div>
    <div class="card"><h3>Challenges and what is next</h3>
    <ul class="muted" style="margin:0;padding-left:1.2em"><li>Phone torches wash out weak projectors, so the host wizard recommends lumens with headroom.</li><li>Depth-camera hand reading is the single remaining sensing step; the gesture is already locked in.</li><li>Next: one-society pilot, short follow-up survey, and a lightweight realtime backend.</li></ul></div></section>

  <section class="section"><div class="card flat"><h3>Credits and AI use</h3><p class="muted">Concept, story and direction by Chandra Pavansai. AI tools used: Claude (Anthropic) for research, writing and code. All illustrations and sounds are original and generated in code. The loneliness figure is from the BMC Public Health study linked above.</p>
    <div class="row"><button class="btn sm" id="rs" type="button">Reset demo data</button><span class="small muted">Removes your events, RSVPs and notes from this browser and restores the examples.</span></div></div></section>`;
  $('#rs',root).onclick=()=>{Store.reset();draft=null;session=null;toast('Demo data reset.');};
}
function viewNotFound(root){root.innerHTML='<div class="card flat"><h1>Page not found</h1><p class="muted" style="margin-top:8px">That page does not exist.</p><a class="btn primary" href="#home">Go home</a></div>';}

/* ============================ ROUTER ============================ */
const ROUTES={home:viewHome,events:viewEvents,event:viewEvent,host:viewHost,join:viewJoin,live:viewLive,results:viewResults,impact:viewImpact,guide:viewGuide,about:viewAbout};
const NAVKEY={home:'home',events:'events',event:'events',host:'host',join:'join',live:'live',results:'events',impact:'impact',guide:'guide',about:'about'};
let cleanup=null,curKey=null;
function go(){
  const raw=(location.hash||'#home').slice(1)||'home';
  if(raw===curKey)return;curKey=raw;
  const i=raw.indexOf('-'),name=i<0?raw:raw.slice(0,i),arg=i<0?'':raw.slice(i+1);
  if(cleanup){try{cleanup();}catch(e){}cleanup=null;}
  const root=$('#view');root.innerHTML='';
  const fn=ROUTES[name]||viewNotFound;
  try{cleanup=fn(root,arg)||null;}catch(err){root.innerHTML='<div class="card flat"><h1>Something went wrong</h1><p class="muted">Reload the page and try again.</p></div>';console.error(err);}
  $$('#nav a').forEach(a=>{if(a.dataset.k===NAVKEY[name])a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  window.scrollTo(0,0);
  const h=$('h1',root);if(h){h.setAttribute('tabindex','-1');try{h.focus({preventScroll:true});}catch(e){}}
}
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href^="#"]');if(!a)return;const h=a.getAttribute('href');if(h==='#view')return;e.preventDefault();nav(h);});
window.addEventListener('hashchange',go);
window.addEventListener('DOMContentLoaded',go);
if(document.readyState!=='loading')go();
window.__LG={go,nav,Store};
})();

</script>
